[project]
name = "aerosim"
version = "0.1.0"
description = "Interactive 2D airfoil potential-flow (panel method) simulator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.136.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
