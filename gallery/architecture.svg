<text x="160.0" y="183" class="s" text-anchor="middle">controls · animation</text>
<rect x="300" y="136" width="200" height="64" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="300" y="148" width="3" height="40" rx="1.5" fill="#c792ea"/>
<text x="400.0" y="163" class="tm" text-anchor="middle">Plotly.js</text>
<text x="400.0" y="183" class="s" text-anchor="middle">flow · Cp · polars</text>
<rect x="540" y="136" width="440" height="64" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="540" y="148" width="3" height="40" rx="1.5" fill="#c792ea"/>
<text x="760.0" y="163" class="tm" text-anchor="middle">index.html · styles.css</text>
<text x="760.0" y="183" class="s" text-anchor="middle">single page, served as static files — no build step</text>
<line x1="260" y1="168" x2="300" y2="168" stroke="#7d8bab" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="160" y1="200" x2="160" y2="298" stroke="#7d8bab" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="172" y="254" class="lab" text-anchor="start">HTTP · JSON</text>
<rect x="60" y="298" width="440" height="128" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="60" y="310" width="3" height="104" rx="1.5" fill="#7ee2a8"/>
<text x="82" y="326" class="ts" text-anchor="start">REST endpoints</text>
<text x="82" y="350" class="m" text-anchor="start">GET  /api/solve</text>
<text x="256" y="350" class="m" text-anchor="start">POST /api/solve_custom</text>
<text x="82" y="369" class="m" text-anchor="start">GET  /api/polar</text>
<text x="256" y="369" class="m" text-anchor="start">POST /api/polar_custom</text>
<text x="82" y="388" class="m" text-anchor="start">GET  /api/samples</text>
<text x="256" y="388" class="s" text-anchor="start">bundled .dat list</text>
<text x="82" y="411" class="ok" text-anchor="start">✓ validated by pydantic — out-of-range input → 422</text>
<rect x="540" y="298" width="440" height="128" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="540" y="310" width="3" height="104" rx="1.5" fill="#7ee2a8"/>
<text x="562" y="326" class="tm" text-anchor="start">_pack() · _polar()</text>
<text x="562" y="350" class="s" text-anchor="start">One JSON response shape per endpoint family:</text>
<text x="562" y="369" class="s" text-anchor="start">airfoil outline, Cp field, streamlines, surface Cp,</text>
<text x="562" y="388" class="s" text-anchor="start">coefficients — or an α sweep for the polar.</text>
<line x1="500" y1="362" x2="540" y2="362" stroke="#7d8bab" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="640" y1="426" x2="640" y2="524" stroke="#7d8bab" stroke-width="1.6" marker-end="url(#ah)"/>
