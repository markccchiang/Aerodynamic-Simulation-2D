<text x="880.0" y="571" class="m" text-anchor="middle">σ, γ, Cp, Cl, Cd, Cm</text>
<text x="880.0" y="590" class="s" text-anchor="middle">+ boundary layer, coupling</text>
<line x1="260" y1="564" x2="300" y2="564" stroke="#7d8bab" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="500" y1="564" x2="540" y2="564" stroke="#7d8bab" stroke-width="1.6" marker-end="url(#ah)"/>
