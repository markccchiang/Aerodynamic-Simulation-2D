<text x="640.0" y="695" class="s" text-anchor="middle">Thwaites → Michel →</text>
<text x="640.0" y="714" class="s" text-anchor="middle">Head → Squire–Young</text>
<rect x="780" y="648" width="200" height="80" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
