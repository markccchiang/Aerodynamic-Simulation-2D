<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">Aerodynamic Simulation 2D — software architecture</title>
<desc id="desc">Three layers. A static browser front-end (app.js, Plotly.js) talks HTTP/JSON to a FastAPI web layer (REST endpoints, _pack and _polar response builders), which calls solve() in a UI-agnostic physics core: naca4 or airfoil_from_dat build a Geometry with a cached LU factorization, solve() returns a Solution, velocity_field and streamlines_from_grid reconstruct the flow field, and boundary_layer() runs when re= is given, feeding back into solve() when couple=True.</desc>
<style>
  .t   { font: 650 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #e8eaed; }
  .st  { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #9aa6bf; }
  .bl  { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: .12em; fill: #9aa6bf; }
  .bp  { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #6f7d99; }
  .tm  { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e8eaed; }
  .ts  { font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #e8eaed; }
  .ts14{ font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #e8eaed; }
  .m   { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c3cde0; }
  .s   { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #9aa6bf; }
  .sf  { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #6f7d99; }
  .ok  { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #7ee2a8; }
  .lab { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #9aa6bf; }
  .vl  { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffd166; }
  .lg  { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #9aa6bf; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7d8bab"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker>
  <filter id="sh" x="-10%" y="-15%" width="120%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect x="0.5" y="0.5" width="1039" height="799" rx="20" fill="#0f1320" stroke="#1f2740"/>
<text x="40" y="52" class="t" text-anchor="start">Aerodynamic Simulation 2D — software architecture</text>
<text x="40" y="76" class="st" text-anchor="start">Three layers, dependencies pointing one way. The web layer holds no physics; it only calls into the core.</text>
<rect x="40" y="100" width="960" height="120" rx="14" fill="#141a2a" stroke="#263049"/>
<text x="60" y="125" class="bl">BROWSER</text>
<text x="980" y="125" class="bp" text-anchor="end">src/aerosim/static/</text>
<rect x="40" y="260" width="960" height="186" rx="14" fill="#141a2a" stroke="#263049"/>
<text x="60" y="285" class="bl">WEB LAYER</text>
<text x="980" y="285" class="bp" text-anchor="end">src/aerosim/webapp.py · FastAPI, served by web.py</text>
<rect x="40" y="486" width="960" height="262" rx="14" fill="#141a2a" stroke="#263049"/>
<text x="60" y="511" class="bl">PHYSICS CORE</text>
<text x="980" y="511" class="bp" text-anchor="end">src/aerosim/ — UI-agnostic</text>
<rect x="60" y="136" width="200" height="64" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="60" y="148" width="3" height="40" rx="1.5" fill="#c792ea"/>
