<text x="880.0" y="695" class="m" text-anchor="middle">velocity_field()</text>
<text x="880.0" y="714" class="m" text-anchor="middle">streamlines_from_grid()</text>
<line x1="615" y1="604" x2="615" y2="648" stroke="#ffd166" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#av)"/>
