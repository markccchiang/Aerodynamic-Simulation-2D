<text x="400.0" y="571" class="s" text-anchor="middle">panel geometry</text>
<text x="400.0" y="590" class="s" text-anchor="middle">cached LU factors</text>
<rect x="540" y="524" width="200" height="80" rx="10" fill="#18263f" stroke="#4a9eff" stroke-width="1.5" filter="url(#sh)"/>
<rect x="540" y="536" width="3" height="56" rx="1.5" fill="#4a9eff"/>
<text x="640.0" y="551" class="tm" text-anchor="middle">solve()</text>
<text x="640.0" y="571" class="m" text-anchor="middle">(geom, α, re=, couple=)</text>
<text x="640.0" y="590" class="s" text-anchor="middle">Hess–Smith panel solve</text>
<rect x="780" y="524" width="200" height="80" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="780" y="536" width="3" height="56" rx="1.5" fill="#4a9eff"/>
