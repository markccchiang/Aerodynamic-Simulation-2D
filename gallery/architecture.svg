<rect x="60" y="648" width="440" height="80" rx="10" fill="#0b1020" stroke="#263049" stroke-width="1" filter="url(#sh)"/>
<rect x="60" y="660" width="3" height="56" rx="1.5" fill="#4a9eff"/>
<text x="82" y="675" class="ts14" text-anchor="start">Use the core without the web UI</text>
<text x="82" y="697" class="m" text-anchor="start">from aerosim import naca4, Geometry, solve</text>
<text x="82" y="715" class="m" text-anchor="start">sol = solve(Geometry(*naca4('2412')), 5.0, re=1e6)</text>
<rect x="540" y="648" width="200" height="80" rx="10" fill="#1b2233" stroke="#2e3a55" stroke-width="1" filter="url(#sh)"/>
<rect x="540" y="660" width="3" height="56" rx="1.5" fill="#ffd166"/>
